spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:datagram}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt-secret=${JWT_SECRET:}
app.cors-origin=${CORS_ORIGIN:http://localhost:4200,http://127.0.0.1:4200}
app.migrate-legacy-passwords=${MIGRATE_LEGACY_PASSWORDS:false}
